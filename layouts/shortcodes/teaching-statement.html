<details class="teaching-statement">
  <summary>
    <span>
      <strong>Full Teaching Statement</strong>
      <small>A detailed account of my pedagogical approach and teaching practice.</small>
    </span>
    <span class="teaching-statement__control" aria-hidden="true">
      <span class="teaching-statement__read">Read full teaching statement ↓</span>
      <span class="teaching-statement__close">Close teaching statement ↑</span>
    </span>
  </summary>
  <div class="teaching-statement__content">
    {{ .Inner | markdownify }}
  </div>
</details>
