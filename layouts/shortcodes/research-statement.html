<details class="research-statement">
  <summary>
    <span class="research-statement__intro">
      <span class="eyebrow">Research narrative</span>
      <strong>Full Research Statement</strong>
      <span>A detailed overview of my research evolution, contributions, and future directions.</span>
    </span>
    <span class="research-statement__control" aria-hidden="true">
      <span class="research-statement__read">Read full statement</span>
      <span class="research-statement__close">Close statement</span>
      <span class="research-statement__icon"></span>
    </span>
  </summary>
  <div class="research-statement__content">
    {{ .Inner | markdownify }}
  </div>
</details>
