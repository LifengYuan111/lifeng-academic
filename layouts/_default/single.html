{{ define "main" }}
<header class="page-hero{{ with .Params.heroClass }} {{ . }}{{ end }}">
  <div class="container page-hero__inner">
    {{ with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </div>
</header>
<div class="container page-layout{{ if not .Params.toc }} page-layout--single{{ end }}{{ with .Params.sectionNav }} page-layout--section-nav{{ end }}">
  {{ if .Params.sectionNav }}
  {{ partial "section-navigation.html" . }}
  {{ else if .Params.toc }}
  <aside class="page-toc" aria-label="On this page">
    <p>On this page</p>
    {{ .TableOfContents }}
  </aside>
  {{ end }}
  <article class="prose">
    {{ .Content }}
  </article>
</div>
{{ end }}
